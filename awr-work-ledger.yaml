    next_action: 更换密钥并通过环境变量注入后显式运行在线冒烟；身份、数据库、网页和 Wiki 仍按原阶段验收。
    evidence: ["docs/verification/cmr-deepseek-20261027T131354551Z.json"]
    "verification": {"evidence_level":"locally_verified"}

