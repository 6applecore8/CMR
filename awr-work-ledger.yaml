goals:
  - id: CMR-AGENT-GOAL
    title: 外贸 CRM 同站点双角色 Agent 工作台
    status: active
    priority: P0
    summary: 依据用户已确认的分阶段计划推进；业务员查询和建档，管理层维护报价与政策，后端独立鉴权。不自动迁移真实客户或 Wiki，不把模型计划接入描述为已实现。
    success_criteria:
      - 员工仅可查询授权数据，当前报价有明确适用条件、有效版本和来源。
      - 一个站点提供业务员与管理入口，登录、接口授权和审计可验证。
      - 模型和 Wiki 后续独立验收，缺失数据、过期价格、异常与越权不产生虚假正常答案。

milestones:
  - id: CMR-M1
    title: 阶段一：规则、契约与本地验证
    status: completed
    scope: [ai-assistant/agent_core]
    acceptance: [领域规则验收通过，明确尚未集成的边界。]
  - id: CMR-M2
    title: 阶段二：数据与身份
    status: planned
    scope: [ai-assistant]
    acceptance: [数据库和全部接口授权通过验收，不自动迁移真实数据。]
  - id: CMR-M3
    title: 阶段三：双角色界面
    status: planned
    scope: [ai-assistant/crm-dashboard]
    acceptance: [同站点双角色完成真实浏览器联调。]
  - id: CMR-M4
    title: 阶段四：模型、Wiki 与效果评测
    status: planned
    scope: [ai-assistant]
    acceptance: [真实模型和只读知识检索单独验证，记录效果与限制。]

