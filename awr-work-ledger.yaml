  - id: CMR-P2-IDENTITY-DATA
    title: PostgreSQL、员工身份和全部接口权限
    status: in_progress
    kind: implementation
    priority: P0
    required: true
    goal: CMR-AGENT-GOAL
    milestone: CMR-M2
    depends_on:
      - CMR-P1-RULES
    paths:
      - ai-assistant
      - docs/superpowers/specs/2026-10-26-agent-workbench-plan.md
    acceptance:
      - 确认客户数据位置与归属，完成备份和迁移预演；未获确认不切换主源。
      - 实现登录、会话与角色授权，旧客户列表、详情、CSV 和编辑接口均受保护。
      - 报价与政策事务保存，数据库参数化查询、受限账号、并发版本与审计通过测试。
    summary: 待实施。现有 http.server 仍为无登录的本机工具，不能对外开放。
    next_action: "Start or configure PostgreSQL, validate schema on an isolated database, then implement persistence and protect all HTTP endpoints before dashboard integration."
    evidence: []

  - id: CMR-P3-ROLE-UI
    title: 同站点业务员工作台与管理入口
    status: planned
    kind: implementation
    priority: P1
    required: true
    goal: CMR-AGENT-GOAL
    milestone: CMR-M3
    depends_on:
      - CMR-P2-IDENTITY-DATA
    paths:
      - ai-assistant/crm-dashboard
    acceptance:
      - 保留现有录入、解析与数据功能，按角色展示客户、问数、报价和管理入口。
      - 报价卡展示版本、条件、来源、有效期和待复核状态，历史报价不能冒充当前价。
      - 真实浏览器验证双角色、越权直连、加载/空态/失败和手机宽度，不以静态检查代替。
    summary: 待实施，当前页面没有新增双角色或 Agent 入口。
    next_action: 在阶段二接口稳定后接入导航、报价中心与管理设置，并进行浏览器联调。
    evidence: []

  - id: CMR-P4-MODEL-WIKI
    title: DeepSeek 工具调用、只读 Wiki 与效果评测
    status: planned
    kind: implementation
    priority: P1
    required: true
    goal: CMR-AGENT-GOAL
    milestone: CMR-M4
    depends_on:
      - CMR-P3-ROLE-UI
    paths:
      - ai-assistant
      - docs/superpowers/specs/2026-10-26-agent-workbench-plan.md
    acceptance:
      - 真实验证 DeepSeek 模型适配，密钥仅在后端，工具有参数与权限限制及调用预算。
      - 明确 Wiki 真实路径与允许文档，只读检索并展示来源，不复制污染业务知识。
      - 以脱敏数据评测工具选择、参数、事实支持、时效、耗时和成本，写操作经过确认。
    summary: 用户于 2026-10-27 改选 DeepSeek；独立适配另行验收，完整在线联调与 Wiki 集成仍待实施。
    next_action: 完成前序联调后确认 Wiki 路径和模型配置，再单独验证真实调用。
    evidence: []

  - id: CMR-DEEPSEEK-ADAPTER
    title: DeepSeek 独立适配与安全配置
    status: completed
    kind: implementation
    priority: P0
